name: Repair OpenJDK 21 ownership split
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/repair-openjdk21.py
      - .github/workflows/repair-openjdk21.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebuild and verify JDK/JRE ownership split
        run: python3 scripts/repair-openjdk21.py
      - name: Preserve repaired candidate and evidence
        run: |
          set -euo pipefail
          git config user.name 'Ocean OpenJDK Repair'
          git config user.email 'packages@ocean.studio'
          git add -A staging/openjdk-21-repair/
          git commit -m "fix(openjdk): remove JRE-owned files from JDK payload [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main update; retrying push ($attempt/5)" >&2
            sleep $((attempt * 2))
          done
          echo "Unable to publish candidate after 5 rebased attempts" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openjdk-21-repaired-candidate
          path: staging/openjdk-21-repair/
