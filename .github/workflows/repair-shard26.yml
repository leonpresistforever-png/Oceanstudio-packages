name: Repair functional shard 26

on:
  push:
    branches: [main]
    paths:
      - 'sources/functional-shards/shard26_profiling.py'
      - 'scripts/repair-functional-shard.py'
      - 'scripts/expansion/shard_batch4.py'
      - 'tests/test-shard26-functional.py'
      - '.github/workflows/repair-shard26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-repair-shard26
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-shard26.yml
            /sources/functional-shards/shard26_profiling.py
            /scripts/repair-functional-shard.py
            /scripts/expansion/shard_batch4.py
            /tests/test-shard26-functional.py
            /staging/shard-26-performance-profiling/
            /apt/dists/stable/
            /apt/ocean.gpg

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg gzip git

      - name: Compile and exercise all 50 profiling commands
        run: |
          set -euo pipefail
          python3 -m py_compile sources/functional-shards/shard26_profiling.py scripts/repair-functional-shard.py tests/test-shard26-functional.py
          python3 tests/test-shard26-functional.py sources/functional-shards/shard26_profiling.py

      - name: Rebuild all 50 shard packages
        run: |
          set -euo pipefail
          python3 scripts/repair-functional-shard.py \
            --runtime sources/functional-shards/shard26_profiling.py \
            --batch scripts/expansion/shard_batch4.py \
            --shard shard-26-performance-profiling \
            --output staging/shard-26-performance-profiling \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages \
            --version 1.0.0-2
          test "$(find staging/shard-26-performance-profiling/pool/main -type f -name '*.deb' | wc -l)" -eq 50
          test "$(grep -c '^Package:' staging/shard-26-performance-profiling/Packages.repaired)" -eq 50
          grep -q '"repair": "placeholder-to-functional"' staging/shard-26-performance-profiling/provenance.json
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' staging/shard-26-performance-profiling sources/functional-shards/shard26_profiling.py

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name "Ocean Package Repair"; git config user.email "packages@ocean.studio"
          git add staging/shard-26-performance-profiling
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(shard26): replace 50 profiling placeholders with functional tools [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publication handoff
        run: echo "Validated staging is preserved. Live publication runs through the complete APT publisher."
