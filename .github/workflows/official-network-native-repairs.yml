name: Build official Caddy and strace for Ocean
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-network-native-repairs.py
      - .github/workflows/official-network-native-repairs.yml
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        package: [caddy, strace]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            staging/official-native-repairs
          filter: blob:none
      - name: Install build and ARM execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user autoconf automake libtool gawk
      - uses: actions/setup-go@v6
        if: matrix.package == 'caddy'
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install official Android NDK r27
        if: matrix.package == 'strace'
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://dl.google.com/android/repository/android-ndk-r27-linux.zip \
            --output "$RUNNER_TEMP/android-ndk-r27.zip"
          unzip -q "$RUNNER_TEMP/android-ndk-r27.zip" -d "$RUNNER_TEMP"
          grep -F 'Pkg.Revision = 27.0.12077973' "$RUNNER_TEMP/android-ndk-r27/source.properties"
      - name: Compile official upstream and exercise the actual ARM executable
        run: python3 scripts/build-network-native-repairs.py '${{ matrix.package }}' --ndk "$RUNNER_TEMP/android-ndk-r27"
      - name: Preserve tested candidates without publishing live metadata
        run: |
          set -euo pipefail
          git config user.name 'Ocean Source Builder'
          git config user.email 'packages@ocean.studio'
          git add 'staging/official-native-repairs/${{ matrix.package }}'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(packages): stage official-source ${{ matrix.package }} repair and execution evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-official-${{ matrix.package }}-evidence
          path: |
            staging/official-native-repairs/${{ matrix.package }}
            build-diagnostics/official-${{ matrix.package }}
