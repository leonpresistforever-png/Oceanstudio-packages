name: Build AI dev shards 46 47 48

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-ai-dev-shards46-48.py'
      - '.github/workflows/build-ai-dev-shards46-48.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-dev-shards46-48
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AI dev build surface
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build-ai-dev-shards46-48.py
            /scripts/index_all_staged.py
            /apt/dists/stable/main/binary-aarch64/Packages
            /apt/dists/stable/main/binary-aarch64/Packages.gz
            /apt/dists/stable/Release
            /apt/dists/stable/InRelease
            /apt/dists/stable/Release.gpg
            /apt/ocean.gpg
            /staging/shard-46/
            /staging/shard-47/
            /staging/shard-48/
            /staging/ai-dev-superpack/
            /.github/workflows/build-ai-dev-shards46-48.yml

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg

      - name: Validate catalog and repo-wide collisions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build-ai-dev-shards46-48.py
          python3 - <<'PY'
          import importlib.util,re,subprocess
          from pathlib import Path
          p=Path("scripts/build-ai-dev-shards46-48.py")
          s=importlib.util.spec_from_file_location("aidev",p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          names=set(m.AI)|set(m.DEV)|set(m.CUSTOM)
          assert len(m.AI)==100 and len(m.DEV)==100 and len(m.CUSTOM)==100 and len(names)==300
          required={"crewai","langgraph","chromadb","rich-cli","aider","open-interpreter","huggingface-cli","gradio","streamlit","dvc","mlflow","prefect","dagster","bentoml","modal","chainlit","zenml","kedro","openai","pytest","pre-commit","pyright","eslint","prettier","vite"}
          assert required <= names
          text=Path("apt/dists/stable/main/binary-aarch64/Packages").read_text(errors="replace")
          live=set(re.findall(r"^Package:\s*(\S+)",text,re.M))
          assert {"litellm","llm","jq"} <= live
          paths=subprocess.check_output(["git","ls-tree","-r","--name-only","HEAD"],text=True).splitlines()
          existing=set();skip=("staging/shard-46/","staging/shard-47/","staging/shard-48/","staging/ai-dev-superpack/")
          for x in paths:
              if x.endswith(".deb") and not x.startswith(skip):existing.add(Path(x).name.split("_",1)[0])
          all_new=names|{"ai-agent-ecosystem-suite","coding-ecosystem-suite","ai-pipeline-utility-suite","ocean-ai-dev-superpack"}
          collisions=sorted(all_new&existing)
          assert not collisions, "repo-wide collisions: "+", ".join(collisions)
          missing=sorted({"pipx","python","npm","nodejs"}-live)
          assert not missing, "missing live dependencies: "+", ".join(missing)
          print("PASS: 300 unique repo-new command packages + 4 meta packages")
          print("LIVE_BASELINE",len(live))
          PY
          grep -c '^Package:' apt/dists/stable/main/binary-aarch64/Packages > /tmp/ocean-before-count

      - name: Build 304 packages
        run: |
          set -euo pipefail
          python3 scripts/build-ai-dev-shards46-48.py
          test "$(find staging/shard-46/pool/main -type f -name '*.deb' | wc -l)" -eq 101
          test "$(find staging/shard-47/pool/main -type f -name '*.deb' | wc -l)" -eq 101
          test "$(find staging/shard-48/pool/main -type f -name '*.deb' | wc -l)" -eq 101
          test "$(find staging/ai-dev-superpack/pool/main -type f -name '*.deb' | wc -l)" -eq 1

      - name: Audit artifacts and provenance
        run: |
          set -euo pipefail
          while IFS= read -r deb; do
            dpkg-deb --info "$deb" >/dev/null
            tmp="$(mktemp -d)"
            dpkg-deb -e "$deb" "$tmp"
            test ! -e "$tmp/preinst"
            test ! -e "$tmp/postinst"
            test ! -e "$tmp/prerm"
            test ! -e "$tmp/postrm"
            rm -rf "$tmp"
          done < <(find staging/shard-46 staging/shard-47 staging/shard-48 staging/ai-dev-superpack -type f -name '*.deb' | sort)
          python3 - <<'PY'
          import json
          from pathlib import Path
          total=0;names=[]
          for n in ("46","47","48"):
              d=json.loads(Path(f"staging/shard-{n}/provenance.json").read_text())
              assert d["commandCount"]==100 and d["packageCount"]==101
              assert d["networkAtAptInstall"] is False and d["rootRequired"] is False
              total += d["packageCount"];names += [x["package"] for x in d["packages"]]
          s=json.loads(Path("staging/ai-dev-superpack/provenance.json").read_text())
          assert total+1==304 and len(names)==303 and len(set(names))==303
          assert s["commandCount"]==300 and s["totalNewPackages"]==304
          print("PASS: package artifacts and provenance verified")
          PY

      - name: Verify requested upstream mappings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("staging/shard-46/provenance.json").read_text())
          m={x["package"]:x for x in d["packages"]}
          expected={
            "crewai":("crewai","crewai"),
            "langgraph":("langgraph-cli","langgraph"),
            "chromadb":("chromadb","chroma"),
            "rich-cli":("rich-cli","rich"),
            "huggingface-cli":("huggingface-hub","hf")
          }
          for p,(up,cmd) in expected.items():
              assert m[p]["upstream"]==up and m[p]["command"]==cmd
          print("PASS: requested AI tools map to their upstream package and executable names")
          PY

      - name: Smoke test self-contained shard
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          dpkg-deb -x staging/shard-48/pool/main/aiutil-ai-prompt-stats_1.0.0-1_all.deb "$root"
          ln -s "$(command -v python3)" "$root/data/data/studio.ocean.app/files/usr/bin/python"
          PREFIX="$root/data/data/studio.ocean.app/files/usr" /bin/sh "$root/data/data/studio.ocean.app/files/usr/bin/aiutil-ai-prompt-stats" "hello AI world" | grep -q '"words": 3'
          rm -rf "$root"
          root="$(mktemp -d)"
          dpkg-deb -x staging/shard-48/pool/main/aiutil-ai-mcp-config-check_1.0.0-1_all.deb "$root"
          ln -s "$(command -v python3)" "$root/data/data/studio.ocean.app/files/usr/bin/python"
          printf '{"mcpServers":{}}\n' > "$root/mcp.json"
          PREFIX="$root/data/data/studio.ocean.app/files/usr" /bin/sh "$root/data/data/studio.ocean.app/files/usr/bin/aiutil-ai-mcp-config-check" "$root/mcp.json" | grep -q '"valid": true'
          rm -rf "$root"
          echo "PASS: representative self-contained packages execute"

      - name: Commit audited staging layer
        run: |
          set -euo pipefail
          git config user.name "Ocean AI Ecosystem Builder"
          git config user.email "packages@ocean.studio"
          git add staging/shard-46 staging/shard-47 staging/shard-48 staging/ai-dev-superpack
          if ! git diff --cached --quiet; then
            git commit -m "feat(shards46-48): stage 304 AI and developer ecosystem packages [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 5
              sleep $((attempt*2))
            done
          fi

      - name: Check trusted signing key
        env:
          OCEAN_REPOSITORY_SIGNING_KEY: ${{ secrets.OCEAN_REPOSITORY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OCEAN_REPOSITORY_SIGNING_KEY" ]; then
            echo "CAN_SIGN=0" >> "$GITHUB_ENV"
            echo "Trusted signing key unavailable: packages remain safely staged."
            exit 0
          fi
          EXPECTED="$(gpg --batch --show-keys --with-colons apt/ocean.gpg 2>/dev/null | awk -F: '$1=="fpr"{print $10;exit}')"
          test -n "$EXPECTED"
          printf '%s\n' "$OCEAN_REPOSITORY_SIGNING_KEY" | gpg --batch --import
          ACTUAL="$(gpg --batch --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="fpr"{print $10;exit}')"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Signing fingerprint mismatch" >&2; exit 1; }
          echo "OCEAN_SIGNING_FINGERPRINT=$EXPECTED" >> "$GITHUB_ENV"
          echo "CAN_SIGN=1" >> "$GITHUB_ENV"

      - name: Promote all staged packages into canonical APT
        if: env.CAN_SIGN == '1'
        run: |
          set -euo pipefail
          python3 scripts/index_all_staged.py
          before="$(cat /tmp/ocean-before-count)"
          after="$(grep -c '^Package:' apt/dists/stable/main/binary-aarch64/Packages)"
          test "$after" -ge "$((before+304))"
          test "$(grep '^Package:' apt/dists/stable/main/binary-aarch64/Packages | sort -u | wc -l)" -eq "$after"
          for p in crewai langgraph chromadb rich-cli aider open-interpreter huggingface-cli gradio streamlit dvc mlflow prefect dagster bentoml modal chainlit zenml kedro openai pytest pre-commit pyright eslint prettier vite ocean-ai-dev-superpack; do
            grep -qx "Package: $p" apt/dists/stable/main/binary-aarch64/Packages
          done
          echo "LIVE_PACKAGE_COUNT=$after" >> "$GITHUB_ENV"

      - name: Sign and verify repository metadata
        if: env.CAN_SIGN == '1'
        run: |
          set -euo pipefail
          RELEASE=apt/dists/stable/Release
          gpg --batch --yes --local-user "$OCEAN_SIGNING_FINGERPRINT" --digest-algo SHA256 --clearsign --output apt/dists/stable/InRelease "$RELEASE"
          gpg --batch --yes --local-user "$OCEAN_SIGNING_FINGERPRINT" --digest-algo SHA256 --detach-sign --output apt/dists/stable/Release.gpg "$RELEASE"
          gpgv --keyring apt/ocean.gpg apt/dists/stable/InRelease
          gpgv --keyring apt/ocean.gpg apt/dists/stable/Release.gpg "$RELEASE"

      - name: Commit live APT promotion
        if: env.CAN_SIGN == '1'
        run: |
          set -euo pipefail
          git add -f apt/pool/main
          git add apt/dists/stable/main/binary-aarch64/Packages apt/dists/stable/main/binary-aarch64/Packages.gz
          git add apt/dists/stable/Release apt/dists/stable/InRelease apt/dists/stable/Release.gpg
          git commit -m "feat(repo): promote AI/dev shards 46-48 live ($LIVE_PACKAGE_COUNT packages) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 5
            sleep $((attempt*2))
          done
          exit 1

      - name: Report
        run: |
          set -euo pipefail
          if [ "$CAN_SIGN" = "1" ]; then
            echo "304 AI/dev packages built, audited, signed and promoted live."
            echo "Live package count: $LIVE_PACKAGE_COUNT"
          else
            echo "304 AI/dev packages built, audited and committed to staging."
            echo "Live promotion skipped because the trusted signing key is unavailable."
          fi
