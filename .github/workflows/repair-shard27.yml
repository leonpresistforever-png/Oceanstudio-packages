name: Repair functional shard 27

on:
  push:
    branches: [main]
    paths:
      - 'sources/functional-shards/shard27_etl.py'
      - 'scripts/repair-shard27.py'
      - 'scripts/expansion/shard_batch4.py'
      - 'tests/test-shard27-functional.py'
      - '.github/workflows/repair-shard27.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-repair-shard27
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-shard27.yml
            /sources/functional-shards/shard27_etl.py
            /scripts/repair-shard27.py
            /scripts/expansion/shard_batch4.py
            /tests/test-shard27-functional.py
            /staging/shard-27-data-stream-etl/
            /apt/dists/stable/
            /apt/ocean.gpg

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg gzip git

      - name: Compile and exercise every repaired command
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sources/functional-shards/shard27_etl.py \
            scripts/repair-shard27.py \
            tests/test-shard27-functional.py
          python3 tests/test-shard27-functional.py sources/functional-shards/shard27_etl.py

      - name: Rebuild all 50 shard packages
        run: |
          set -euo pipefail
          python3 scripts/repair-shard27.py \
            --runtime sources/functional-shards/shard27_etl.py \
            --batch scripts/expansion/shard_batch4.py \
            --output staging/shard-27-data-stream-etl \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages

          test "$(find staging/shard-27-data-stream-etl/pool/main -type f -name '*.deb' | wc -l)" -eq 50
          test "$(grep -c '^Package:' staging/shard-27-data-stream-etl/Packages.repaired)" -eq 50
          grep -q '"repair": "placeholder-to-functional"' staging/shard-27-data-stream-etl/provenance.json
          grep -q '"packageCount": 50' staging/shard-27-data-stream-etl/provenance.json
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' \
            staging/shard-27-data-stream-etl sources/functional-shards/shard27_etl.py

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name "Ocean Package Repair"
          git config user.email "packages@ocean.studio"

          git add staging/shard-27-data-stream-etl


          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi

          git commit -m "fix(shard27): replace 50 placeholder packages with functional tools [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publication handoff
        run: echo "Validated staging is preserved. Live publication runs through the complete APT publisher."
