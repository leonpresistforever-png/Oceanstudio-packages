name: Repair 150 functional packages (08 10 11)

on:
  push:
    branches: [main]
    paths:
      - 'sources/functional-shards/shard08_network.py'
      - 'sources/functional-shards/shard10_devops.py'
      - 'sources/functional-shards/shard11_toolchain.py'
      - 'tests/test-shard08-functional.py'
      - 'tests/test-shard10-functional.py'
      - 'tests/test-shard11-functional.py'
      - '.github/workflows/repair-150-shards08-10-11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-repair-150-08-10-11
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-150-shards08-10-11.yml
            /sources/functional-shards/shard08_network.py
            /sources/functional-shards/shard10_devops.py
            /sources/functional-shards/shard11_toolchain.py
            /tests/test-shard08-functional.py
            /tests/test-shard10-functional.py
            /tests/test-shard11-functional.py
            /scripts/repair-functional-shard.py
            /scripts/expansion/shard_batch1.py
            /scripts/expansion/shard_batch2.py
            /staging/functional-repair-status.json
            /staging/shard-08-network-traffic-sockets/
            /staging/shard-10-devops-microservices/
            /staging/shard-11-compiler-toolchain-helpers/
            /apt/dists/stable/main/binary-aarch64/Packages

      - name: Install build and test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev git gcc binutils

      - name: Compile repair sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sources/functional-shards/shard08_network.py \
            sources/functional-shards/shard10_devops.py \
            sources/functional-shards/shard11_toolchain.py \
            tests/test-shard08-functional.py \
            tests/test-shard10-functional.py \
            tests/test-shard11-functional.py \
            scripts/repair-functional-shard.py

      - name: Validate shard 08 network
        run: |
          set -euo pipefail
          python3 tests/test-shard08-functional.py \
            sources/functional-shards/shard08_network.py \
            scripts/expansion/shard_batch1.py

      - name: Validate shard 10 DevOps
        run: |
          set -euo pipefail
          python3 tests/test-shard10-functional.py \
            sources/functional-shards/shard10_devops.py \
            scripts/expansion/shard_batch1.py

      - name: Validate shard 11 toolchain
        run: |
          set -euo pipefail
          python3 tests/test-shard11-functional.py \
            sources/functional-shards/shard11_toolchain.py \
            scripts/expansion/shard_batch2.py

      - name: Rebuild shard 08
        run: |
          set -euo pipefail
          python3 scripts/repair-functional-shard.py \
            --runtime sources/functional-shards/shard08_network.py \
            --batch scripts/expansion/shard_batch1.py \
            --batch-symbol BATCH1_SHARDS \
            --shard shard-08-network-traffic-sockets \
            --output staging/shard-08-network-traffic-sockets \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages \
            --version 1.0.0-2

      - name: Rebuild shard 10
        run: |
          set -euo pipefail
          python3 scripts/repair-functional-shard.py \
            --runtime sources/functional-shards/shard10_devops.py \
            --batch scripts/expansion/shard_batch1.py \
            --batch-symbol BATCH1_SHARDS \
            --shard shard-10-devops-microservices \
            --output staging/shard-10-devops-microservices \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages \
            --version 1.0.0-2

      - name: Rebuild shard 11
        run: |
          set -euo pipefail
          python3 scripts/repair-functional-shard.py \
            --runtime sources/functional-shards/shard11_toolchain.py \
            --batch scripts/expansion/shard_batch2.py \
            --batch-symbol BATCH2_SHARDS \
            --shard shard-11-compiler-toolchain-helpers \
            --output staging/shard-11-compiler-toolchain-helpers \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages \
            --version 1.0.0-2

      - name: Audit all 150 rebuilt packages
        run: |
          set -euo pipefail
          for shard in \
            shard-08-network-traffic-sockets \
            shard-10-devops-microservices \
            shard-11-compiler-toolchain-helpers
          do
            test "$(find "staging/$shard/pool/main" -type f -name '*.deb' | wc -l)" -eq 50
            test "$(grep -c '^Package:' "staging/$shard/Packages.repaired")" -eq 50
            grep -q '"repair": "placeholder-to-functional"' "staging/$shard/provenance.json"
            test "$(python3 - "$shard" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads((Path("staging")/sys.argv[1]/"provenance.json").read_text())
          print(len({x["package"] for x in d["packages"]}))
          PY
          )" -eq 50
          done
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' \
            staging/shard-08-network-traffic-sockets \
            staging/shard-10-devops-microservices \
            staging/shard-11-compiler-toolchain-helpers \
            sources/functional-shards/shard08_network.py \
            sources/functional-shards/shard10_devops.py \
            sources/functional-shards/shard11_toolchain.py

      - name: Update functional repair status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("staging/functional-repair-status.json")
          d=json.loads(p.read_text())
          add=[
            "shard-08-network-traffic-sockets",
            "shard-10-devops-microservices",
            "shard-11-compiler-toolchain-helpers",
          ]
          by={x["name"]:x for x in d["shards"]}
          for name in add:
              by[name]={"name":name,"packages":50,"testsPassed":50,"status":"staged-functional"}
          d["shards"]=sorted(by.values(),key=lambda x:x["name"])
          repaired=sum(x["packages"] for x in d["shards"] if x["status"] in ("staged-functional","live-functional"))
          d["stagedFunctionalRepairs"]=repaired
          d["remainingPlaceholderPackages"]=max(0,d["targetExpansionPackages"]-repaired)
          p.write_text(json.dumps(d,indent=2)+"\n")
          if repaired < 800 or d["remainingPlaceholderPackages"] > 200:
              raise SystemExit(f"expected >=800 repaired and <=200 remaining, got {repaired}/{d['remainingPlaceholderPackages']}")
          print(f"repaired={repaired} remaining={d['remainingPlaceholderPackages']}")
          PY

      - name: Commit validated 150-package repair
        run: |
          set -euo pipefail
          git config user.name "Ocean Package Repair"
          git config user.email "packages@ocean.studio"
          git add \
            staging/shard-08-network-traffic-sockets \
            staging/shard-10-devops-microservices \
            staging/shard-11-compiler-toolchain-helpers \
            staging/functional-repair-status.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix(packages): replace 150 placeholders in shards 08 10 11 [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent push detected; retry $attempt/5"
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report
        run: |
          echo "Validated package identities: 150/150"
          echo "Rebuilt functional packages: 150"
          cat staging/functional-repair-status.json
