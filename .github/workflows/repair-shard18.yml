name: Repair functional shard 18

on:
  push:
    branches: [main]
    paths:
      - 'sources/functional-shards/shard18_analysis.py'
      - 'scripts/repair-functional-shard.py'
      - 'scripts/expansion/shard_batch3.py'
      - 'tests/test-shard18-functional.py'
      - '.github/workflows/repair-shard18.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-repair-shard18
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-shard18.yml
            /sources/functional-shards/shard18_analysis.py
            /scripts/repair-functional-shard.py
            /scripts/expansion/shard_batch3.py
            /tests/test-shard18-functional.py
            /staging/shard-18-code-lint-analysis/
            /apt/dists/stable/
            /apt/ocean.gpg

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg gzip git

      - name: Compile and exercise all 50 analysis commands
        run: |
          set -euo pipefail
          python3 -m py_compile sources/functional-shards/shard18_analysis.py scripts/repair-functional-shard.py tests/test-shard18-functional.py
          python3 tests/test-shard18-functional.py sources/functional-shards/shard18_analysis.py

      - name: Rebuild all 50 shard packages
        run: |
          set -euo pipefail
          python3 scripts/repair-functional-shard.py \
            --runtime sources/functional-shards/shard18_analysis.py \
            --batch scripts/expansion/shard_batch3.py \
            --batch-symbol BATCH3_SHARDS \
            --shard shard-18-code-lint-analysis \
            --output staging/shard-18-code-lint-analysis \
            --live-packages apt/dists/stable/main/binary-aarch64/Packages \
            --version 1.0.0-2
          test "$(find staging/shard-18-code-lint-analysis/pool/main -type f -name '*.deb' | wc -l)" -eq 50
          test "$(grep -c '^Package:' staging/shard-18-code-lint-analysis/Packages.repaired)" -eq 50
          grep -q '"repair": "placeholder-to-functional"' staging/shard-18-code-lint-analysis/provenance.json
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' staging/shard-18-code-lint-analysis sources/functional-shards/shard18_analysis.py

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name "Ocean Package Repair"; git config user.email "packages@ocean.studio"
          git add staging/shard-18-code-lint-analysis
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(shard18): replace 50 code-analysis placeholders with functional tools [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publication handoff
        run: echo "Validated staging is preserved. Live publication runs through the complete APT publisher."
