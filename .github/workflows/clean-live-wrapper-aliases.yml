name: Audit legacy package payloads without deletion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Inspect every pool archive and indexed payload
        run: python3 scripts/audit_package_payloads.py --json /tmp/ocean-legacy-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-legacy-payload-audit
          path: /tmp/ocean-legacy-audit.json
