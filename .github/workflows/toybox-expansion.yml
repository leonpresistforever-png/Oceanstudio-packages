name: Build official-source Toybox expansion

on:
  push:
    branches: [main]
    paths:
      - 'sources/toybox-0.8.14/**'
      - 'scripts/build-toybox-expansion.py'
      - '.github/workflows/toybox-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-toybox-expansion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/toybox-expansion.yml
            scripts/build-toybox-expansion.py
            sources/toybox-0.8.14
            staging

      - name: Install official Android NDK r27 and packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg gzip git make gcc curl unzip
          NDK_HOME="$RUNNER_TEMP/android-ndk-r27"
          if [ ! -f "$NDK_HOME/source.properties" ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 1800 -o "$RUNNER_TEMP/android-ndk-r27-linux.zip" "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
            unzip -q "$RUNNER_TEMP/android-ndk-r27-linux.zip" -d "$RUNNER_TEMP"
          fi
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*27\.0\.12077973[[:space:]]*$' "$NDK_HOME/source.properties"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Build and validate 153-package expansion
        run: |
          set -euo pipefail
          rm -rf staging/toybox-0.8.14
          python3 scripts/build-toybox-expansion.py --manifest sources/toybox-0.8.14/manifest.json --ndk "$ANDROID_NDK_HOME" --output staging/toybox-0.8.14
          test "$(find staging/toybox-0.8.14/pool/main -name '*.deb' | wc -l)" -eq 153
          test "$(grep -c '^Package: ' staging/toybox-0.8.14/dists/stable/main/binary-aarch64/Packages)" -eq 153
          grep -q '"packageCount": 153' staging/toybox-0.8.14/provenance.json
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' staging/toybox-0.8.14

      - name: Commit compiled staging batch for central signed publication
        run: |
          set -euo pipefail
          git config user.name "Ocean Package Builder"
          git config user.email "packages@ocean.studio"
          git add staging/toybox-0.8.14
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build 153 official-source Toybox Ocean packages [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
