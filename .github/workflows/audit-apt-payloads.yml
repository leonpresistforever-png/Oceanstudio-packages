name: Audit all Ocean pool payloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_package_payloads.py
      - .github/workflows/audit-apt-payloads.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Inspect every archive and indexed payload
        continue-on-error: true
        run: python3 scripts/audit_package_payloads.py --json /tmp/ocean-payload-audit.json
      - name: Install ARM execution test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Execute the actual indexed glibc runtime and utilities
        run: |
          set -euo pipefail
          TEST_ROOT=$(mktemp -d)
          for deb in apt/pool/main/ocean-glibc*_2.44-1_*.deb; do
            dpkg-deb -x "$deb" "$TEST_ROOT"
          done
          GLIBC="$TEST_ROOT/data/data/studio.ocean.app/files/glibc"
          qemu-aarch64 "$GLIBC/lib/ld-linux-aarch64.so.1" --library-path "$GLIBC/lib" "$GLIBC/bin/getconf" GNU_LIBC_VERSION | tee /tmp/ocean-glibc-execution.txt
          grep -Fx 'glibc 2.44' /tmp/ocean-glibc-execution.txt
          qemu-aarch64 "$GLIBC/lib/ld-linux-aarch64.so.1" --library-path "$GLIBC/lib" "$GLIBC/bin/iconv" --version >> /tmp/ocean-glibc-execution.txt
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-payload-audit
          path: /tmp/ocean-*.json
      - name: Preserve runtime output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-glibc-execution
          path: /tmp/ocean-glibc-execution.txt
