name: Build Ocean Lab 200 package suite

on:
  push:
    branches: [main]
    paths:
      - 'sources/ocean-lab-200/ocean_lab.py'
      - 'scripts/build-ocean-lab-200.py'
      - 'tests/test-ocean-lab-200.py'
      - '.github/workflows/ocean-lab-200.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-lab-200
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sources/ocean-lab-200/ocean_lab.py
            /scripts/build-ocean-lab-200.py
            /tests/test-ocean-lab-200.py
            /staging/ocean-lab-200/
            /.github/workflows/ocean-lab-200.yml

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Compile and functionally test
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sources/ocean-lab-200/ocean_lab.py \
            scripts/build-ocean-lab-200.py \
            tests/test-ocean-lab-200.py
          python3 tests/test-ocean-lab-200.py sources/ocean-lab-200/ocean_lab.py

      - name: Prove 200 package names are new
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,subprocess
          from pathlib import Path
          p=Path("sources/ocean-lab-200/ocean_lab.py")
          s=importlib.util.spec_from_file_location("lab",p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          paths=subprocess.check_output(["git","ls-tree","-r","--name-only","HEAD"],text=True).splitlines()
          existing={Path(x).name.split("_",1)[0] for x in paths if x.endswith(".deb") and not x.startswith("staging/ocean-lab-200/")}
          collisions=sorted(set(m.COMMANDS)&existing)
          if collisions: raise SystemExit("repo-wide package collisions: "+", ".join(collisions))
          assert len(m.COMMANDS)==200 and len(set(m.COMMANDS))==200
          print("PASS: 200/200 package names are new")
          PY

      - name: Build exactly 200 packages
        run: |
          set -euo pipefail
          python3 scripts/build-ocean-lab-200.py \
            --runtime sources/ocean-lab-200/ocean_lab.py \
            --output staging/ocean-lab-200

      - name: Audit generated packages
        run: |
          set -euo pipefail
          test "$(find staging/ocean-lab-200/pool/main -type f -name '*.deb' | wc -l)" -eq 200
          test "$(grep -c '^Package:' staging/ocean-lab-200/Packages.repaired)" -eq 200
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path("staging/ocean-lab-200/provenance.json").read_text())
          assert d["packageCount"]==200
          assert d["uniquePackageCount"]==200
          assert len(d["groups"])==10
          assert all(v==20 for v in d["groups"].values())
          assert len({x["package"] for x in d["packages"]})==200
          required={
            "ocean-lab-office-docx-text",
            "ocean-lab-pdf-page-count",
            "ocean-lab-mail-attachments",
            "ocean-lab-cal-ics-events",
            "ocean-lab-token-jwt-payload",
            "ocean-lab-project-project-detect",
            "ocean-lab-source-detect-language",
            "ocean-lab-binary-varint-decode",
            "ocean-lab-string-mustache-lite",
            "ocean-lab-bundle-aab-modules",
          }
          names={x["package"] for x in d["packages"]}
          assert required<=names
          for row in d["packages"][:10]:
              fields=subprocess.check_output(["dpkg-deb","-f",str(Path("staging/ocean-lab-200/pool/main")/row["artifact"])],text=True)
              assert "Depends: python" in fields
          print("PASS: provenance, domain identities and dependencies verified")
          PY
          while IFS= read -r deb; do
            dpkg-deb --info "$deb" >/dev/null
          done < <(find staging/ocean-lab-200/pool/main -type f -name '*.deb' | sort)
          ! grep -R -a -E '/data/(data|user/0)/com\.termux|packages\.termux\.dev|TERMUX_PREFIX' \
            staging/ocean-lab-200 sources/ocean-lab-200/ocean_lab.py

      - name: Commit staged suite
        run: |
          set -euo pipefail
          git config user.name "Ocean Lab Builder"
          git config user.email "packages@ocean.studio"
          git add staging/ocean-lab-200
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(lab): stage 200 unique functional packages [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Report
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("staging/ocean-lab-200/provenance.json"))
          print("Ocean Lab staged:",d["packageCount"],"packages")
          print("Groups:",d["groups"])
          PY
