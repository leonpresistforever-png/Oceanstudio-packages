name: Request OceanStudio source APK build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # APK assets alone cannot carry Java/native fixes. The private production
      # workflow compiles current source and requires the established certificate.
      # Never generate a replacement signing identity or accept PATs as inputs.
      - name: Dispatch the verified production workflow
        env:
          OCEAN_APK_BUILD_TOKEN: ${{ secrets.OCEAN_APK_BUILD_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("OCEAN_APK_BUILD_TOKEN", "")
          if not token:
              raise SystemExit(
                  "OCEAN_APK_BUILD_TOKEN is not configured. Run production-apk.yml "
                  "in Oceanstudio.apk with its existing signing configuration. "
                  "Repacking an older APK is not a source build."
              )
          endpoint = ("https://api.github.com/repos/leonpresistforever-png/"
                      "Oceanstudio.apk/actions/workflows/production-apk.yml/dispatches")
          request = urllib.request.Request(
              endpoint, data=json.dumps({"ref": "main"}).encode(), method="POST",
              headers={"Authorization": "Bearer " + token,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit("Production workflow dispatch was not accepted")
          print("Production source build requested; this is not a successful build or release.")
          PY
