name: Build Ocean distro manager package
on:
  push:
    branches: [main]
    paths:
      - packages/ocean-distro/**
      - packages/proot-distro/**
      - scripts/build-ocean-distro-package.py
      - tests/test-ocean-distro.py
      - .github/workflows/build-ocean-distro-package.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Build and validate Ocean-owned package
        run: python3 scripts/build-ocean-distro-package.py
      - name: Preserve validated candidate
        run: |
          set -euo pipefail
          git config user.name 'Ocean Distro Builder'
          git config user.email 'packages@ocean.studio'
          git add staging/ocean-distro-repair
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(distro): stage validated ocean-distro and proot-distro repair [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main update; retrying (/5)" >&2
            sleep 0
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-distro-repair
          path: staging/ocean-distro-repair
